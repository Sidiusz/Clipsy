name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build Clipsy/Clipsy.csproj -c Release -p:Platform=x64

      # OCR-quality and ffmpeg cases skip themselves: the runner has no models or ffmpeg.
      - name: Test
        run: dotnet test Clipsy.Tests/Clipsy.Tests.csproj -c Release -p:Platform=x64

      - name: Vulnerable packages
        shell: pwsh
        run: |
          $report = dotnet list Clipsy/Clipsy.csproj package --vulnerable --include-transitive 2>&1 | Out-String
          Write-Output $report
          if ($report -match 'has the following vulnerable packages') { exit 1 }
